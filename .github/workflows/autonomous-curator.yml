name: Autonomous Governance Atlas Curator

on:
  schedule:
    - cron: '0 7 * * 1,4' # Runs automatically every Monday & Thursday at 07:00 UTC
  workflow_dispatch:       # Lets you trigger an immediate run with 1 click

jobs:
  curate-and-verify:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - run: npm ci

      - name: Discover, map, and verify new governance interoperability edges
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: npm run curate

      - name: Verify TypeScript & production build pass before committing
        run: npm run build

      - name: Commit verified growth to repository
        run: |
          git config user.name "atlas-curator[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/data/atlas.json CHANGELOG.md
          git diff --staged --quiet || git commit -m "data(atlas): autonomous verified governance mapping update"
          git push
